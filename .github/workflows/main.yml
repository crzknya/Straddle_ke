name: build-ipa
# Собирается автоматически, когда в main меняется код приложения,
# и вручную: Actions → build-ipa → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

# Новая сборка отменяет предыдущую незавершённую.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.straddle.local

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Straddle.xcodeproj -scheme Straddle \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" build
      - name: Pack IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Straddle.app Payload/
          zip -qry Straddle.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Straddle-unsigned
          path: Straddle.ipa
      - name: Run unit tests
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, devs in data.items() if "iOS" in runtime for d in devs if d["name"].startswith("iPhone")]
          print(ids[-1] if ids else "")
          ')
          echo "Simulator: $UDID"
          xcodebuild -project Straddle.xcodeproj -scheme Straddle \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" test

