workflows:
  unsigned-ipa:
    name: Straddle unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
      cancel_previous_builds: true
    # Не собирать, если поменялись только описание, картинки или настройки CI.
    when:
      changeset:
        excludes:
          - '**/*.md'
          - 'docs/**'
          - '.github/**'
          - 'codemagic.yaml'
          - 'LICENSE'
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen || true
          xcodegen generate
      - name: Build unsigned
        script: |
          xcodebuild -project Straddle.xcodeproj -scheme Straddle \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.straddle.local" build
      - name: Pack IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Straddle.app Payload/
          zip -qry Straddle.ipa Payload
    artifacts:
      - Straddle.ipa
